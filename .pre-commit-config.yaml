repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Use the tool versions locked by the project so results match CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
        require_serial: true
      - id: biome
        name: biome
        entry: npm --prefix frontend exec -- biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: ^frontend/
        pass_filenames: false
