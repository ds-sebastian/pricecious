[project]
name = "pricecious"
version = "0.3.0"
description = "Self-hosted price tracker that reads prices from screenshots with vision models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "apprise",
    "asyncpg",
    "fastapi",
    "granian",
    "httpx",
    "json-repair",
    "litellm",
    "pandas",
    "pillow",
    "playwright",
    "prophet",
    "pydantic",
    "sqlalchemy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "aiosqlite",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:'imghdr' is deprecated:DeprecationWarning"]  # inside apprise
